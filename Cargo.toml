[package]
name = "tauri-plugin-secure-keystore"
version = "0.0.3-beta.1"
description = "Encrypted key-value storage backed by the Android Keystore, iOS Keychain, and the desktop OS credential store. No biometric enrollment required by default, with an optional per-item lock (OS biometric/PIN/pattern/password, or an app-managed password) for apps that want one."
authors = ["Abdullah <abdullah72308@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Abdullah-5603/tauri-plugin-secure-keystore"
edition = "2021"
rust-version = "1.77.2"
keywords = ["tauri", "keystore", "keychain", "android", "ios"]
categories = ["gui", "os::android-apis", "cryptography"]
links = "tauri-plugin-secure-keystore"

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
aes-gcm = { version = "0.10", features = ["zeroize"] }
argon2 = "0.5"
rand = "0.8"
base64 = "0.22"
zeroize = "1"

[target.'cfg(target_os = "ios")'.dependencies]
tauri = { version = "2", features = ["wry"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
keyring = "4"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
